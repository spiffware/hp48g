[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hp48g-desktop"
version = "0.1.0"
description = "HP 48G inspired scientific RPN calculator for Qt6"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "sympy>=1.12,<2", "numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hp48g = "hp48g.app:main"

[tool.setuptools.packages.find]
include = ["hp48g*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
